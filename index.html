<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GESHA HOTEL BOT</title><style>body{font:16px system-ui;background:#101827;color:#f6f8fc;margin:0}main{max-width:780px;margin:auto;padding:20px}section{background:#1b2940;border-radius:16px;padding:20px;margin:15px 0}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #53627b;background:#111d31;color:white}button{background:#2783ef;border:0;font-weight:700;cursor:pointer}.log{min-height:100px;white-space:pre-wrap;line-height:1.6}.muted{color:#a8b7cc}h1{margin-bottom:5px}</style></head><body><main><h1>🏨 GESHA HOTEL BOT</h1><p class="muted">Демонстрационный помощник гостиницы — без настоящей ИИ-модели</p><section><h2>Гостевой чат</h2><input id="room" placeholder="Номер комнаты (необязательно)"><div class="log" id="log">Бот: Здравствуйте! Спросите про Wi-Fi, парковку, заселение или сообщите о неисправности.</div><form id="chat"><input id="msg" placeholder="Ваш вопрос" required><button>Отправить</button></form></section><section><h2>Панель администратора</h2><p class="muted">Только для локального тестирования. Не используйте реальные данные гостей.</p><input id="key" type="password" placeholder="ADMIN_KEY"><button id="load">Показать заявки</button><div class="log" id="tickets"></div><h3>Изменить FAQ</h3><select id="faqkey" style="padding:10px"><option value="wifi">Wi-Fi</option><option value="parking">Парковка</option><option value="checkin">Заселение</option></select><textarea id="answer" placeholder="Ответ для гостей"></textarea><button id="save">Сохранить ответ</button><p id="status"></p></section></main><script>
const el=id=>document.getElementById(id);const api=async(path,options={})=>{const r=await fetch(path,options);const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j};const headers=()=>({'Content-Type':'application/json','X-Admin-Key':el('key').value});
el('chat').onsubmit=async e=>{e.preventDefault();const m=el('msg').value;el('msg').value='';el('log').textContent+='\nВы: '+m;try{const r=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,room:el('room').value})});el('log').textContent+='\nБот: '+r.reply}catch(err){el('log').textContent+='\nОшибка: '+err.message}};
el('load').onclick=async()=>{try{const t=await api('/api/tickets',{headers:headers()});el('tickets').textContent=t.length?t.map(x=>'#'+x.id+' · '+x.status+' · '+(x.room||'без номера')+' · '+x.issue).join('\n\n'):'Заявок пока нет'}catch(e){el('tickets').textContent='Ошибка: '+e.message}};
el('save').onclick=async()=>{try{await api('/api/faq',{method:'POST',headers:headers(),body:JSON.stringify({key:el('faqkey').value,answer:el('answer').value})});el('status').textContent='Сохранено'}catch(e){el('status').textContent='Ошибка: '+e.message}};
</script></body></html>
